# ================================================================
# SelfGuard 全局自护九条刚性规则
# ================================================================
# 用途：限定 SelfGuard 流水线内部加载生效，管控主 Harness 基础设施变更
# 隔离：主业务流水线完全隔离，无法读取、复用此规则集
# 生效域：仅对项目 /harness 全局目录进行变更管控
# ================================================================

self_guard_global_rules:

  - rule_id: SG-R1
    rule_name: 改动范围铁律
    priority: CRITICAL
    category: scope_boundary
    description: >
      所有对主 Harness 的修改，必须由用户明确给出文件路径、修改字段、
      明确变更目标；禁止自主推断扩大修改范围、跨文件附带改动、删减用户
      未指定的原有流程节点。超出用户明确范围的改动，直接评审驳回。
    check_items:
      - 核对用户提交的修改文件清单与实际变更文件是否一致
      - 检测是否存在用户未指定的附属文件修改
      - 检测是否存在原有流程节点的删减行为
      - 检测修改范围是否超出用户明确给出的文件路径
    violation_action: reject
    reject_message: >
      [SG-R1 改动范围铁律] 检测到修改超出用户明确指定范围。
      额外文件/跨文件附带改动/原有节点删减一律驳回。请严格按照用户
      指示的文件路径和变更目标重新提交。

  - rule_id: SG-R2
    rule_name: 主 Harness 底层架构不可破坏基线
    priority: CRITICAL
    category: baseline_protection
    description: >
      主 Harness 七阶流水线流转顺序、UUID 门阀隔离机制、双轨卷宗存储、
      历史只增不删原则、上下文隔离底层逻辑，属于不可动摇基础设施基线。
      修改仅允许增补、配置替换、逻辑适配；禁止删除、倒置、整体重构
      原有底层流转流程。
    check_items:
      - 检测七阶流水线 S1-S7 流转顺序是否被倒置或跳过
      - 检测 UUID 门阀隔离机制是否被绕过或删除
      - 检测双轨卷宗存储逻辑是否被破坏
      - 检测历史只增不删原则是否被违反
      - 检测上下文隔离底层逻辑是否被削弱
      - 只允许增补型/配置替换型/逻辑适配型修改
    violation_action: reject
    reject_message: >
      [SG-R2 不可破坏基线] 检测到主 Harness 底层架构基线被破坏。
      仅允许增补、配置替换、逻辑适配；禁止删除、倒置、整体重构原有底层流转流程。
      请修正为增补/配置替换/逻辑适配型修改后重新提交。

  - rule_id: SG-R3
    rule_name: Harness 变更强制升级为最高风险等级
    priority: CRITICAL
    category: risk_enforcement
    description: >
      任何主 Harness 内部文件变更，系统自动判定为超高风险。
      S2 阶段必须强制输出四项材料：改动影响域、完整回退方案、
      前置校验步骤、落地后后置验证方案，四项缺一不可，禁止进入编码环节。
    check_items:
      - 自动将涉及 src/ 的变更判定为超高风险（highest）
      - 验证 S2 方案是否包含「改动影响域」板块
      - 验证 S2 方案是否包含「完整回退方案」板块
      - 验证 S2 方案是否包含「前置校验步骤」板块
      - 验证 S2 方案是否包含「落地后后置验证方案」板块
      - 四项材料缺任一 → 阻断进入 S3 编码阶段
    violation_action: reject
    reject_message: >
      [SG-R3 强制最高风险等级] Harness 基础设施变更自动判定为超高风险。
      S2 方案必须包含四项材料：改动影响域 / 完整回退方案 / 前置校验步骤 /
      后置验证方案。当前 S2 方案缺少以下材料：{{missing_items}}。
      请补充完整后重新提交。

  - rule_id: SG-R4
    rule_name: 禁止隐性削弱原有防护能力
    priority: CRITICAL
    category: protection_escalation
    description: >
      规则修改、评审逻辑修改，只允许增强校验强度、合并冗余规则、
      精简臃肿结构；绝不允许删减评审维度、弱化拦截条件、降低原有
      系统防护等级。逆向削弱防护的改动直接拦截。
    check_items:
      - 对比修改前后的评审维度数量（只增不减）
      - 对比修改前后的拦截条件强度（只增不减）
      - 检测是否删除了现有校验规则
      - 检测是否放宽了现有拦截阈值
      - 检测合并冗余规则时是否遗漏了原有校验点
    violation_action: reject
    reject_message: >
      [SG-R4 禁止隐性削弱] 检测到原有防护能力被削弱。
      评审维度/拦截条件/防护等级只允许增强，禁止删减维度、弱化条件、
      降低防护等级。请修正为增强型修改后重新提交。

  - rule_id: SG-R5
    rule_name: 双向兼容强制校验规则
    priority: CRITICAL
    category: compatibility
    description: >
      改动落地后必须保证新版本主 Harness 完全兼容历史卷宗、历史变更记录、
      已标记稳定固化模块、历史 UUID 身份档案，不得造成历史数据失效、
      流水线上下文断裂。兼容性校验不通过则阻断流水线。
    check_items:
      - 验证新版本 Harness 能否正确读取历史审计卷宗（JSON 格式兼容）
      - 验证新版本 Harness 能否正确读取历史流水线运行记录
      - 验证已标记稳定固化模块（stable markers）是否未被破坏
      - 验证历史 UUID 身份档案（TXS-xxxx 格式）是否被正确识别
      - 验证流水线上下文（FlowRunState）在新旧版本间能否平滑迁移
      - 检测数据模型变更是否向后兼容（字段只增不删）
    violation_action: reject
    reject_message: >
      [SG-R5 双向兼容] 新版本 Harness 未通过兼容性校验。
      历史卷宗/历史变更记录/稳定固化模块/UUID身份档案/流水线上下文
      必须完全兼容。请修正兼容性问题后重新提交。

  - rule_id: SG-R6
    rule_name: 基础设施配套文档同步规则
    priority: HIGH
    category: documentation_sync
    description: >
      修改 Harness 规则、评审逻辑、调度逻辑时，必须同步更新 Harness
      架构说明文档、规则释义文档，保证代码实现与书面文档完全一致，
      变更记录单独归档至 SelfGuard 专属卷宗。
    check_items:
      - 检测本次修改是否涉及 Harness 规则文件
      - 检测本次修改是否涉及评审逻辑（DelegateReviewer/SelfReviewer）
      - 检测本次修改是否涉及调度逻辑（FlowEngine/StageRunner）
      - 若涉及以上任一项，验证是否同步更新了 README.md
      - 验证变更记录是否已写入 SelfGuard 专属卷宗
    violation_action: reject
    reject_message: >
      [SG-R6 文档同步] 检测到 Harness 规则/评审逻辑/调度逻辑变更，
      但缺少配套文档更新。必须同步更新架构说明文档和规则释义文档，
      变更记录归档至 SelfGuard 专属卷宗。请补充文档后重新提交。

  - rule_id: SG-R7
    rule_name: 全量单元测试强制 100% 通过
    priority: CRITICAL
    category: test_enforcement
    description: >
      Harness 自身全套单元测试、集成测试必须全部通过；
      任意测试用例失败，直接阻断变更落地，禁止强行放行。
    check_items:
      - 执行 src/__tests__/ 下全部测试用例
      - 所有测试必须通过（零失败）
      - 检测是否有跳过（skip）的测试用例
      - 检测是否有被注释掉的测试断言
      - 集成测试回归验证
    violation_action: reject
    reject_message: >
      [SG-R7 测试强制] Harness 单元测试未全部通过。
      失败用例数：{{failed_count}} / 总计：{{total_count}}。
      任意测试失败直接阻断变更落地，禁止强行放行。请修复测试失败后重新提交。

  - rule_id: SG-R8
    rule_name: 基础设施变更痕迹强化归档规则
    priority: HIGH
    category: audit_trail
    description: >
      所有经由 SelfGuard 发起的主 Harness 改动，单独标记【基础设施变更】
      标签，存入独立卷宗分区，永久追加不可删除，支持完整溯源与版本回退。
    check_items:
      - 验证审计记录是否携带【基础设施变更】专属标签
      - 验证审计数据是否写入 data/self_guard/audit/ 独立分区
      - 验证审计条目遵循只增不删原则
      - 验证是否维护了版本链（上一稳定版本引用）
      - 验证是否支持一键回退至上一稳定版本
    violation_action: reject
    reject_message: >
      [SG-R8 归档规则] 基础设施变更痕迹未按规范归档。
      必须携带【基础设施变更】标签、写入独立卷宗分区、记录版本链。
      请补充归档信息后重新提交。

  - rule_id: SG-R9
    rule_name: 架构重构提案权限收缩规则
    priority: CRITICAL
    category: permission_control
    description: >
      SelfGuard 内部大幅收缩 AI 全局优化提案权限：仅允许提出冗余合并、
      结构精简类优化；禁止主动提议底层架构重构、流程颠覆、核心机制替换。
      主 Harness 重大内核重构，必须由用户主动发起指令，AI 无权主动提议。
    check_items:
      - 检测 AI 是否在 S2 方案中主动提出了底层架构重构提案
      - 检测 AI 是否在 S2 方案中主动提出了流程颠覆方案
      - 检测 AI 是否在 S2 方案中主动提出了核心机制替换建议
      - 验证优化提案类型是否仅限「冗余合并」或「结构精简」
      - 若出现用户未发起的重构提案 → 自动拦截并警告
    violation_action: reject
    reject_message: >
      [SG-R9 权限收缩] AI 无权主动提议底层架构重构/流程颠覆/核心机制替换。
      仅允许冗余合并、结构精简类优化。如确需重大内核重构，须由用户主动发起指令。
      请移除超出权限范围的优化提案后重新提交。

  - rule_id: SG-R10
    rule_name: 版本迭代强制复审铁律
    priority: CRITICAL
    category: iteration_review
    description: >
      每一次通过 SelfGuard 对主 Harness 做升级、迭代、规则增补、逻辑调整后，
      必须自动执行一轮内部 Review 自检：校验新旧规则、评审逻辑、配置条目之间
      是否语义重叠、逻辑冗余、条目臃肿、权责交叉、上下规则相互矛盾；
      必须自动合并重复语义、剔除冗余描述、收拢交叉条目，保证整体规则体系紧凑、
      层级递进、无多余重复内容，且全程不削弱原有任何防护能力。
    check_items:
      - 检查新增规则与存量规则是否语义重复、范围重叠
      - 检查整套规则体系是否出现结构臃肿、条目细碎、逻辑割裂问题
      - 校验全链路规则目标一致、约束口径统一，无自相矛盾
      - 自动输出冗余分析报告
      - 若检出明显臃肿与重复，必须同步完成合理精简合并
      - 精简合并全程保证防护强度不变、体系更紧凑
    violation_action: reject
    reject_message: >
      [SG-R10 版本迭代复审] 检测到规则体系存在语义重叠/逻辑冗余/条目臃肿/
      权责交叉/上下矛盾问题。必须自动合并重复语义、剔除冗余描述、收拢交叉条目，
      保证整体规则体系紧凑、层级递进、无多余重复内容。全程不削弱原有任何防护能力。
      请完成规则体系精简合并后重新提交。

  - rule_id: SG-R11
    rule_name: 外部制衡与旁路巡检铁律
    priority: CRITICAL
    category: external_oversight
    description: >
      系统全局只承认 SelfGuard 为 Harness 配置、脚本、规则、底层逻辑修改的
      合法入口；其余任何会话、任何身份，全部禁止改动管控中枢。后台持续旁路扫描
      全系统所有文件写入行为，一旦捕获任意非 SelfGuard 身份修改 /harness 目录
      的行为，立刻标记为基础设施越权事件，独立留痕告警。每次迭代 Harness 时，
      复审环节强制校验下游主体权限基线是否合规、顶层拦截规则是否正常启用。
    check_items:
      - GlobalWatchdog 后台旁路巡检是否已启动
      - 是否捕获到非 SelfGuard 身份的 /harness 目录修改（越权事件）
      - 下游主体（M1-M9/业务模块）对 /harness 目录读写权限是否符合只读基线
      - 顶层基础设施拦截规则（SG-R1~R10）是否完整、未被删除或削弱
      - SelfGuard 是否为 /harness 目录的唯一合法变更入口
      - 越权告警是否已独立留痕归档至 breach_alerts 卷宗
    violation_action: reject
    reject_message: >
      [SG-R11 外部制衡] 检测到以下外部制衡缺口：{{breach_details}}。
      - 若存在越权事件：立即阻断非 SelfGuard 写入路径，补上唯一入口固件。
      - 若权限基线违规：限制下游主体对 /harness 目录的写入权限，降至只读。
      - 若拦截规则被削弱：恢复被删除/弱化的规则条目的 violation_action: reject。
      以上问题全部修复后方可闭环。

