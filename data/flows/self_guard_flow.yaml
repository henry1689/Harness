# ================================================================
# Flow ID: self_guard_flow
# Flow Name: SelfGuard 基础设施自护流水线
# 适配项目：wenstar-cc (TS5.7 Node22)
# 职责：专门管控主 Harness 自身的基础设施变更
# 隔离：与主业务流水线物理隔离，配置/规则/评审/卷宗完全独立
# ================================================================
flow_id: self_guard_flow
flow_name: SelfGuard 基础设施自护流水线
version: 1.2.0
max_jump_limit: 10
global_memo_key: self_guard_global_constraint

# ================================================================
# 🔴 SelfGuard 十条自护铁律（全阶段自动注入）
# ================================================================
# 说明：以下十条铁律在 SelfGuard 流水线每个阶段启动前自动注入，
# 主业务流水线完全隔离，无法读取此规则集。
global_arch_constraint: |
  # ==================== SelfGuard 十条自护铁律（不可突破） ====================

  # SG-R1 改动范围铁律
  所有对主 Harness 的修改，必须由用户明确给出文件路径、修改字段、明确变更目标；
  禁止自主推断扩大修改范围、跨文件附带改动、删减用户未指定的原有流程节点。
  超出用户明确范围的改动，直接评审驳回。

  # SG-R2 主 Harness 底层架构不可破坏基线
  主 Harness 七阶流水线流转顺序、UUID 门阀隔离机制、双轨卷宗存储、
  历史只增不删原则、上下文隔离底层逻辑，属于不可动摇基础设施基线。
  修改仅允许增补、配置替换、逻辑适配；禁止删除、倒置、整体重构原有底层流转流程。

  # SG-R3 Harness 变更强制升级为最高风险等级
  任何主 Harness 内部文件变更，系统自动判定为超高风险。
  S2 阶段必须强制输出四项材料：改动影响域、完整回退方案、前置校验步骤、
  落地后后置验证方案，四项缺一不可，禁止进入编码环节。

  # SG-R4 禁止隐性削弱原有防护能力
  规则修改、评审逻辑修改，只允许增强校验强度、合并冗余规则、精简臃肿结构；
  绝不允许删减评审维度、弱化拦截条件、降低原有系统防护等级。逆向削弱防护的改动直接拦截。

  # SG-R5 双向兼容强制校验规则
  改动落地后必须保证新版本主 Harness 完全兼容历史卷宗、历史变更记录、
  已标记稳定固化模块、历史 UUID 身份档案，不得造成历史数据失效、流水线上下文断裂。
  兼容性校验不通过则阻断流水线。

  # SG-R6 基础设施配套文档同步规则
  修改 Harness 规则、评审逻辑、调度逻辑时，必须同步更新 Harness 架构说明文档、
  规则释义文档，保证代码实现与书面文档完全一致，变更记录单独归档至 SelfGuard 专属卷宗。

  # SG-R7 全量单元测试强制 100% 通过
  Harness 自身全套单元测试、集成测试必须全部通过；
  任意测试用例失败，直接阻断变更落地，禁止强行放行。

  # SG-R8 基础设施变更痕迹强化归档规则
  所有经由 SelfGuard 发起的主 Harness 改动，单独标记【基础设施变更】标签，
  存入独立卷宗分区，永久追加不可删除，支持完整溯源与版本回退。

  # SG-R9 架构重构提案权限收缩规则
  SelfGuard 内部大幅收缩 AI 全局优化提案权限：仅允许提出冗余合并、结构精简类优化；
  禁止主动提议底层架构重构、流程颠覆、核心机制替换。
  主 Harness 重大内核重构，必须由用户主动发起指令，AI 无权主动提议。

  # SG-R10 版本迭代强制复审铁律
  每一次通过 SelfGuard 对主 Harness 做升级、迭代、规则增补、逻辑调整后，必须自动执行一轮
  内部 Review 自检：校验新旧规则、评审逻辑、配置条目之间是否语义重叠、逻辑冗余、条目臃肿、
  权责交叉、上下规则相互矛盾；必须自动合并重复语义、剔除冗余描述、收拢交叉条目，
  保证整体规则体系紧凑、层级递进、无多余重复内容，且全程不削弱原有任何防护能力。

  # SG-R11 外部制衡与旁路巡检铁律
  系统全局只承认 SelfGuard 为 Harness 配置、脚本、规则、底层逻辑修改的合法入口；
  其余任何会话、任何身份，全部禁止改动管控中枢。后台 GlobalWatchdog 持续旁路扫描
  所有文件写入行为；捕获非 SelfGuard 修改 /harness → 越权告警 + 独立留痕。
  每次迭代复审强制校验下游权限基线 + 拦截规则完整性。

global_implementation_rules: |
  # ==================== SelfGuard 开发落地强制校验规则 ====================

  # 规则 A：生效域限定
  SelfGuard 仅允许对项目 src/harness/ 全局目录进行变更管控，
  自动拦截所有上层业务目录（src/m1-m9, src/app, src/webui 等）的改动请求。
  业务迭代走主 Harness，Harness 基础设施改造走 SelfGuard。

  # 规则 B：两套流水线物理隔离
  SelfGuard 规则集、评审器、卷宗分区完全独立于主 Harness。
  主业务流水线无法读取 SelfGuard 规则，SelfGuard 不干涉主业务流水线。

  # 规则 C：基础设施卷宗独立分区
  所有 Harness 基础设施变更统一打上【基础设施变更】专属标签，
  独立归档至 data/harness/self_guard/audit/，与业务卷宗完全分区隔离。

  # 规则 D：版本链与一键回退
  每次 SelfGuard 流水线完成后，自动在版本链中记录变更快照。
  支持一键回退至上一稳定版本。历史只增不删原则同样适用于 SelfGuard 卷宗。

  # 规则 E：流水线闭环前八阶体检
  ① 编译校验（tsc --noEmit）→ ② 全量单元测试（vitest run）→
  ③ SelfReviewer 十一条铁律全维度评审 → ④ 版本一致性复审自检（去臃肿/去重复/一致性）→
  ⑤ 外部制衡强制审计（权限基线+拦截规则+唯一入口+越权检测）→
  ⑥ 兼容性校验 → ⑦ 文档同步校验 → ⑧ 卷宗归档校验

# ================================================================
# 全流程阶段定义（S1-S7，七阶流水线）
# 状态机严格锁定顺序，AI 无权限跳步
# ================================================================
stages:

  # ==================== S1 问题收录 & 影响范围盘点 ====================
  - stage_id: S1_Problem_Analysis
    stage_name: 基础设施变更定位 & Harness牵连风险盘点
    work_manual: |
      1. 完整复述本次 Harness 基础设施变更目标，区分类型：
         - 配置修改（YAML 流水线配置调整）
         - 规则升级（global_arch_constraint / global_implementation_rules 修改）
         - 评审逻辑适配（DelegateReviewer 维度增删）
         - 内核微调（FlowEngine / StageRunner / GateController 逻辑调整）
         - 新增子系统（如本次 SelfGuard 自身）
      2. 扫描所有待修改文件，自动判定为超高风险（SG-R3）：
         🔴 所有 src/harness/*.ts 文件均为超高风险
         🔴 所有 data/harness/flows/*.yaml 文件均为超高风险
      3. 枚举所有 import 依赖被修改文件的上层模块，输出完整牵连清单；
      4. 识别是否触碰核心基础设施基线（SG-R2）：
         - FlowEngine DFA 状态机流转逻辑
         - StageRunner 执行流程
         - GateController 门控判定
         - DelegateReviewer 十一维评审体系
         - AuditLogger 双轨卷宗机制
         - UUID 门阀隔离机制
         - 上下文隔离底层逻辑
      5. 预判全局影响：
         - 主业务流水线是否受波及
         - 已有审计卷宗是否可读
         - 历史运行状态是否兼容
      6. 本阶段仅分析，禁止输出任何修改代码、禁止写入任何文件。
    tool_whitelist:
      read_file: true
      list_dir: true
      search_code: true
      grep_import: true
      run_cli_check: true
      write_file: false
      delete_file: false
      run_modify_script: false
    gate_type: human
    next_stage: S2_Solution_Design

  # ==================== S2 方案设计 ====================
  - stage_id: S2_Solution_Design
    stage_name: 基础设施变更方案设计 & 自护铁律合规审查
    work_manual: |
      1. 根据 S1 的影响范围盘点，撰写基础设施变更落地方案；
      2. 🔴 SG-R3 强制要求：方案必须包含以下四项材料（缺一不可）：
         (a) 改动影响域：列出所有受影响的 Harness 文件、模块、下游消费方
         (b) 完整回退方案：包含 git revert 步骤、数据回滚步骤、配置回退步骤
         (c) 前置校验步骤：编译检查、测试检查、兼容性预检的具体执行命令
         (d) 落地后后置验证方案：如何确认变更生效且未引入新问题
      3. 逐条对照十条自护铁律进行方案合规自检：
         SG-R1: 改动范围是否严格限定在用户指定的文件？
         SG-R2: 是否仅做增补/配置替换/逻辑适配，不破坏基线？
         SG-R3: 四项材料是否齐全？
         SG-R4: 是否保持或增强了原有防护能力？
         SG-R5: 是否考虑了双向兼容？
         SG-R6: 是否需要同步更新文档？
         SG-R7: 是否需要在 S5 阶段执行全量测试？
         SG-R8: 变更记录是否需要归档到 SelfGuard 专属卷宗？
         SG-R9: 是否超出了 AI 提案权限范围？
         SG-R10: 是否存在规则语义重叠、逻辑冗余、条目臃肿？
         SG-R11: 下游权限基线是否合规？拦截规则是否完整？GlobalWatchdog 越权事件？
      4. 🔴 SG-R9 权限检查：AI 只能提冗余合并、结构精简类优化；
         底层架构重构、流程颠覆、核心机制替换必须由用户主动发起；
      5. 输出用户审批选项：确认执行 / 修改方案 / 驳回。
    tool_whitelist:
      read_file: true
      list_dir: true
      search_code: true
      grep_import: true
      run_cli_check: true
      write_file: false
      delete_file: false
      run_modify_script: false
    gate_type: human
    next_stage: S3_Code_Implement

  # ==================== S3 编码落地 ====================
  - stage_id: S3_Code_Implement
    stage_name: 编码落地（仅限定范围内修改）
    work_manual: |
      1. 严格按照 S2 审批通过的方案执行代码修改；
      2. 🔴 SG-R1 严格执行：仅修改用户明确指定的文件路径和字段；
         禁止跨文件附带改动，禁止删减用户未指定的流程节点；
      3. 🔴 SG-R2 严格执行：仅做增补/配置替换/逻辑适配，不破坏底层基线；
      4. 🔴 SG-R9 严格执行：编码时不可偷偷植入被否决的优化逻辑；
      5. 修改完成后立即执行编译检查（npx tsc --noEmit）；
      6. 在代码变更块中标注改动原因引用（关联 S2 方案中的决策项）。
    tool_whitelist:
      read_file: true
      write_file: true
      list_dir: true
      search_code: true
      grep_import: true
      run_cli_check: true
      delete_file: false
      run_modify_script: false
    gate_type: auto
    next_stage: S4_SelfReview

  # ==================== S4 SelfReview 独立评审（使用 SelfReviewer） ====================
  - stage_id: S4_SelfReview
    stage_name: SelfReviewer 十一条自护铁律全维度评审
    work_manual: |
      1. 🔴 激活 SelfReviewer 独立评审组件（非主 Harness 的 DelegateReviewer）；
      2. 对当前变更执行十一条自护铁律全维度逐条校验：
         SG-R1: 改动范围边界检查
         SG-R2: 底层架构基线完整性检查
         SG-R3: S2 四项材料完整性复核
         SG-R4: 防护能力增强/削弱方向判定
         SG-R5: 双向兼容性实际校验
         SG-R6: 文档同步状态检查
         SG-R7: 测试覆盖与通过状态检查
         SG-R8: 归档标签与独立性检查
         SG-R9: AI 提案权限越界检测
         SG-R10: 版本迭代强制复审（去臃肿/去重复/一致性校验）
         SG-R11: 外部制衡与旁路巡检（权限基线+拦截规则+唯一入口+越权检测）
      3. 🔴 版本一致性复审自检（SG-R10 强制植入，每次迭代自动触发）：
         ① 检查新增规则与存量规则是否语义重复、范围重叠；
         ② 检查整套规则体系是否出现结构臃肿、条目细碎、逻辑割裂问题；
         ③ 校验全链路规则目标一致、约束口径统一，无自相矛盾；
         ④ 自动输出冗余分析报告，若检出明显臃肿与重复，必须同步完成合理精简合并，
           保证防护强度不变、体系更紧凑。
      4. 🔴 外部制衡强制审计（SG-R11 强制植入，每次迭代自动触发）：
         ① 审计下游主体对 /harness 目录的读写权限是否符合只读基线；
         ② 校验顶层基础设施拦截规则（SG-R1~R11）是否完整启用、无一被弱化或删除；
         ③ 核验 SelfGuard 为 /harness 目录唯一合法变更入口；
         ④ 叠加 GlobalWatchdog 旁路巡检——报告本次迭代前的越权事件清单。
      5. 输出双通道信号（machine_signal + human_report）；
      6. 任一铁律违规 → 驳回 S3，附带具体违规条目和修正指引；
      7. 全部通过 → 进入 S5 编译测试。
    tool_whitelist:
      read_file: true
      list_dir: true
      search_code: true
      grep_import: true
      run_cli_check: true
      write_file: false
      delete_file: false
      run_modify_script: false
    gate_type: condition
    next_stage_pass: S5_Compile_Test
    next_stage_reject: S3_Code_Implement
    runner_mode: delegate

  # ==================== S5 编译 & 测试 ====================
  - stage_id: S5_Compile_Test
    stage_name: TypeScript编译检查 & 全量单元测试
    work_manual: |
      1. 🔴 SG-R7 强制要求：执行全量 Harness 单元测试；
      2. 编译检查：npx tsc --noEmit（零类型错误）；
      3. 全量测试：npx vitest run src/harness/__tests__/（零测试失败）；
      4. 任意测试失败 → 直接阻断变更落地，打回 S3；
      5. 输出编译报告和测试报告摘要。
    tool_whitelist:
      read_file: true
      list_dir: true
      search_code: true
      grep_import: true
      run_cli_check: true
      write_file: false
      delete_file: false
      run_modify_script: false
    gate_type: condition
    next_stage_pass: S6_Compatibility_Check
    next_stage_reject: S3_Code_Implement

  # ==================== S6 兼容性校验 ====================
  - stage_id: S6_Compatibility_Check
    stage_name: 双向兼容性校验 & 文档同步核验
    work_manual: |
      1. 🔴 SG-R5 双向兼容强制校验：
         (a) 验证新版本 Harness 能否正确读取历史审计卷宗 JSON 文件
         (b) 验证新版本 Harness 能否解析历史 FlowRunState 数据
         (c) 验证已标记稳定固化模块未被破坏
         (d) 验证历史 UUID 身份档案格式兼容
         (e) 验证数据模型变更向后兼容（字段只增不删）
      2. 🔴 SG-R6 文档同步核验：
         (a) 检查 harness/self_guard/README.md 是否已同步更新
         (b) 检查规则释义是否与代码实现一致
         (c) 检查变更记录是否已准备归档
      3. 兼容性或文档校验不通过 → 阻断流水线，打回 S3。
    tool_whitelist:
      read_file: true
      list_dir: true
      search_code: true
      grep_import: true
      run_cli_check: true
      write_file: false
      delete_file: false
      run_modify_script: false
    gate_type: condition
    next_stage_pass: S7_Archive
    next_stage_reject: S3_Code_Implement

  # ==================== S7 归档闭环 ====================
  - stage_id: S7_Archive
    stage_name: 基础设施变更痕迹归档 & 版本链维护
    work_manual: |
      1. 🔴 SG-R8 强化归档：
         (a) 所有变更记录打上【基础设施变更】专属标签
         (b) 审计数据写入 data/harness/self_guard/audit/ 独立分区
         (c) 记录完整变更链：S1分析 → S2方案 → S3编码 → S4评审 → S5测试 → S6兼容
      2. 版本链维护：
         (a) 记录当前版本号与上一稳定版本号
         (b) 存储回退快照引用（git commit hash）
         (c) 确保一键回退路径可用
      3. 输出变更报告摘要，闭环流水线。
    tool_whitelist:
      read_file: true
      write_file: true
      list_dir: true
      search_code: true
      grep_import: true
      run_cli_check: true
      delete_file: false
      run_modify_script: false
    gate_type: auto
    next_stage: END
