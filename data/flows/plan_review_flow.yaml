# ════════════════════════════════════════════════════════════════════
# plan_review_flow.yaml — 方案预审流程（中/高风险改动的写入授权通路）
# ════════════════════════════════════════════════════════════════════
# 为什么需要这个流程（2026-09-11）：
#
#   现状：Sentinel 的风险分支是 low → 直接放行；mid/high → 必须有令牌。
#   而令牌由 flow-terminal-policy 把关，要求 success=true + flow_status/end_reason
#   双 completed；但完整流程（S1→S7-B）的 S4.5 按**磁盘现状**给「修改目的达成度」
#   打分 —— 改动还没落地时必然低分、必然被拒。
#
#   ⇒ **中高风险改动的写授权存在鸡生蛋**：要写就得先有令牌，要有令牌就得先写完。
#     实际结果：中/高风险只能靠 owner 逐文件输密码签豁免。
#
#   本流程的作用：只评价**方案**（不评价已落地的改动），走到 S4 独立评审通过即
#   END → flow_status=completed → 现有令牌策略照常签发令牌（范围限本次申报的
#   文件集）→ Agent 用该令牌完成写入 → 再跑完整流程收口归档。
#
# 🔴 设计要点
#   1. **stage_id 复用主流程同名**（S1_Problem_Analysis / S2_Solution_Design /
#      S4_Arch_Review）。MCP 侧已有的委托注册、human gate、conditionGateCheck 全部
#      照常生效，零改线；其中 S4_Arch_Review 绑的是 forkedReview（**独立子进程**评审），
#      这正是「高风险必须独立评审」所要求的形态。
#   2. 本流程**不含 S3/S5/S6/S7**：它只授权「可以动手」，不负责「动手完成」。
#      收口仍走 wenstaros_core_repair_flow.yaml。
#   3. 本流程签发的令牌是**短期、限定文件集**的写授权，不等于竣工令牌。
#
# 🔴 已知取舍（owner 2026-09-11 决策，明文留档）
#   本流程的输入（方案文字、问题分类、选型理由、确认键）**全部由申请方 Agent 提供**，
#   链路上不存在人类锚点。它防的是「无意失误」，**防不住「蓄意绕过」**。
#   需要人类兜底时，请改用 exemptions.json 的密码门通道。
# ════════════════════════════════════════════════════════════════════

flow_id: plan_review_flow
flow_name: 方案预审流程（中/高风险写入授权）
version: 1.0
max_jump_limit: 6
max_stage_retries: 3
max_s3_retries: 1
global_memo_key: plan_review_global_constraint

global_arch_constraint: |
  1. 本流程只授权【方案已审查通过的精确文件集】，不授权任何未申报文件；
  2. 方案必须逐文件列明「改什么、为什么改」，不得出现「同上」「等」「若干」这类模糊量词；
  3. 高风险内核改动（架构/公共底层/数据模型/管线）必须给出回退方案与影响面清单；
  4. 方案一经通过，实际改动文件集必须与申报集**完全一致**——扩大范围即视为越权，
     须重新走本流程（不得用「顺手改」扩张）；
  5. 本流程通过仅代表「允许开始动手」，不代表变更合格；竣工必须另跑完整流程。

global_implementation_rules: |

  - 方案必须可执行、可核验：每个「为什么改」都要能对应到一个可观察的事实（报错、用例、
    文档条款、性能数据），不接受「感觉需要」「顺便优化」。

  - 必须明确问题本质分类（specific_bug / coupling_debt / arch_structural_defect）。
    归错类会导致后续审查维度错配，一律驳回重填。

  - 若存在多个可选方案，必须给出至少两套并说明取舍理由；只给一套方案时必须写明
    「为何不存在第二种可行路径」。

  - 必须列明影响面：上下游调用方、共享数据、对外契约、其它模块的复用点。声明「无影响」
    时必须给出判定依据，不得留空。

  - 方案不得包含未申报的顺带改动。想改就先申报，不要夹带。

stages:

  # ====================== S1 问题定位与影响面盘点 ======================
  - stage_id: S1_Problem_Analysis
    stage_name: 方案预审·问题定位与影响面盘点
    work_manual: |
      目标：把「要改什么、为什么改、会牵动谁」讲清楚，作为 S2 方案的输入。

      1. 复述要解决的问题，并给出**可观察的证据**（报错原文/失败用例/文档条款/性能数据）。
         不接受「感觉不合理」「顺手优化」这类无证据动机。
      2. 判定问题本质（三选一，写进 S2 方案的 problem_nature）：
         - specific_bug           单点缺陷，无横向复用
         - coupling_debt          耦合欠债，需结构性偿还
         - arch_structural_defect 架构级缺陷
      3. 盘点影响面（逐项列出，不得用「等」「若干」）：
         - 拟改动文件清单（**这就是本次申请的授权范围，写全写准**）
         - 上下游调用方 / 共享数据 / 对外契约 / 其它模块复用点
         - 声明「无影响」时必须附判定依据
    tool_whitelist:
      read_file: true
      list_dir: true
      search_code: true
      grep_import: true
      run_cli_check: true
      write_file: false
      delete_file: false
      run_modify_script: false
    gate_type: auto
    next_stage: S2_Solution_Design
    runner_mode: local

  # ====================== S2 方案定稿（人工终审节点）======================
  - stage_id: S2_Solution_Design
    stage_name: 方案预审·方案撰写与结构化提交
    work_manual: |
      🔴【提交即申请授权】本流程通过后，系统会为本方案申报的文件集签发写令牌。
      因此**方案里列了哪些文件，Agent 就只被授权改哪些文件** —— 写全、写准、别夹带。

      【必填板块一：问题本质分类】三选一，空缺/模糊/省略 → 直接驳回
        □ specific_bug（单点缺陷，无横向复用）
        □ coupling_debt（耦合欠债）
        □ arch_structural_defect（架构级缺陷）

      【必填板块二：拟改动文件清单】逐文件列出，**不允许「等」「若干」「同上」**
        格式：<相对路径> —— <本文件要改什么> —— <为什么必须改它>
        🔴 此清单即本次授权范围，实际改动超出即越权，须重新走本流程。

      【必填板块三：影响面核验】
        上下游调用方 / 共享数据 / 对外契约 / 其它模块复用点，逐项列出；
        声明「无横向影响」时必须写明判定依据（检索了什么、为什么排除）。

      【必填板块四：方案选型】
        若存在多种可行路径，给出至少两套并说明取舍；只给一套时说明为何无第二路径。

      【必填板块五：回退方案】
        若本次改动需要回退，如何回退（基线还原/配置开关/数据迁移回滚）。

      🔴 高风险内核改动（架构/公共底层/数据模型/管线）额外要求：
        - 影响面清单必须覆盖全部复用点，不接受抽样；
        - 必须给出「不动方案」的后果分析（为什么不能不改）。
    tool_whitelist:
      read_file: true
      list_dir: true
      search_code: true
      grep_import: true
      run_cli_check: true
      write_file: false
      delete_file: false
      run_modify_script: false
    gate_type: human
    next_stage: S4_Arch_Review
    runner_mode: local

  # ====================== S4 独立架构评审（delegate 独立进程）======================
  - stage_id: S4_Arch_Review
    stage_name: 方案预审·独立架构评审
    work_manual: |
      由**独立子进程**评审（forkedReview），不以申请方自述为准，须自行核验：

      1. 证据可核验性：S1 声称的「可观察证据」是否真实存在且可复现；
      2. 文件清单完备性：申报的改动文件集是否覆盖了问题根因所需的全部改动
         （漏报 → 后续必然越权改动，此处驳回）；
      3. 影响面真实性：对「无横向影响」的声明，独立检索并验证其判定依据；
      4. 分类正确性：problem_nature 归类是否与证据一致（把共性伪装成个性 → 驳回）；
      5. 选型合理性：给出的方案取舍是否成立；
      6. 回退可行性：回退方案是否真的可执行。

      全部通过 → 放行 END，系统据本次文件集签发写令牌。
      任一存疑 → 驳回，退回 S2 补全方案。
    tool_whitelist:
      read_file: true
      list_dir: true
      search_code: true
      grep_import: true
      run_cli_check: true
      write_file: false
      delete_file: false
      run_modify_script: false
    gate_type: auto
    next_stage: END
    runner_mode: delegate
